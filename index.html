<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#dcd6cd">
<title>משק בית</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;500&family=Heebo:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#1d1d1f;--soft:#6e6a64;--line:rgba(29,29,31,.12);--red:#c8102e}
body{font-family:"Heebo",-apple-system,sans-serif;font-weight:300;color:var(--ink);min-height:100vh;
background:radial-gradient(circle at 15% 0%,#efebe5 0%,transparent 55%),radial-gradient(circle at 90% 100%,#c9c1b5 0%,transparent 60%),#dcd6cd;background-attachment:fixed}
header{text-align:center;padding:calc(env(safe-area-inset-top) + 44px) 0 6px}
h1{font-family:"Frank Ruhl Libre",serif;font-weight:300;font-size:50px;letter-spacing:2px;
background:linear-gradient(135deg,#7d5f27,#d9bb6a 40%,#a5803b 65%,#ead39a);-webkit-background-clip:text;background-clip:text;color:transparent}
.rule{width:44px;height:1px;background:linear-gradient(90deg,transparent,#b8964f,transparent);margin:14px auto}
.sub{color:var(--soft);font-size:13px;letter-spacing:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:16px;padding:28px 22px 70px;max-width:1100px;margin:auto}
.icon{position:relative;overflow:hidden;border-radius:26px;padding:26px 8px 20px;text-align:center;cursor:pointer;-webkit-user-select:none;user-select:none;
background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.85);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
box-shadow:0 12px 30px rgba(60,50,40,.10),inset 0 1px 0 #fff;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.icon::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(circle at var(--sx,50%) var(--sy,0%),rgba(255,255,255,.95),transparent 60%)}
.icon:hover::before,.icon:active::before{opacity:.85}
.icon::after{content:"";position:absolute;top:0;left:-80%;width:45%;height:100%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,255,255,.9),transparent);transform:skewX(-20deg)}
.icon.sh::after{animation:sweep .9s ease}
@keyframes sweep{to{left:140%}}
svg.i{position:relative;width:38px;height:38px;stroke:var(--ink);stroke-width:1.1;fill:none;stroke-linecap:round;stroke-linejoin:round}
.icon .t{position:relative;display:block;margin-top:12px;font-size:15px;font-weight:400}
.screen{display:none;position:fixed;inset:0;z-index:20;background:#e4dfd8;padding:calc(env(safe-area-inset-top) + 20px) 20px 60px;overflow-y:auto}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.top h2{font-family:"Frank Ruhl Libre",serif;font-weight:300;font-size:34px}
.btn{background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:22px;padding:9px 16px;font:400 15px "Heebo";cursor:pointer;text-decoration:none}
.card{background:#fbfaf8;border:1px solid #fff;border-radius:22px;margin-bottom:12px;box-shadow:0 8px 22px rgba(60,50,40,.07)}
.form{display:grid;gap:12px;padding:18px;margin-bottom:22px}
.f{display:grid;gap:6px}
.f span{font-size:13px;color:var(--soft);letter-spacing:1px}
input,select{font:300 17px "Heebo";padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);width:100%;-webkit-appearance:none;appearance:none}
.add{font:400 16px "Heebo";letter-spacing:1px;padding:14px;border-radius:14px;border:none;background:var(--ink);color:#fff;cursor:pointer}
.row{display:flex;align-items:center;gap:14px;padding:15px 18px}
.chk{width:28px;height:28px;flex-shrink:0;cursor:pointer}
.chk circle{stroke:var(--soft);stroke-width:1;fill:none}
.chk path{stroke:#fff;stroke-width:1.6;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .4s}
.on .chk circle{fill:var(--ink);stroke:var(--ink)}
.on .chk path{stroke-dashoffset:0}
.grow{flex:1}
.title{font-size:17px;font-weight:400}
small{color:var(--soft);display:block;margin-top:3px;font-size:13px}
.done .title{text-decoration:line-through;color:#a1a1a6}
h3{margin:24px 4px 12px;color:var(--soft);font-size:12px;font-weight:400;letter-spacing:3px}
.empty{color:#9a958e;text-align:center;padding:16px}
.warn{color:var(--red)}
.up{color:var(--red)}.down{color:#2e7d4f}
.side{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:30;width:54px;padding:14px 0;border-radius:0 20px 20px 0;text-align:center;cursor:pointer;font-size:12px;background:rgba(255,255,255,.7);border:1px solid #fff}
.side.hot{background:var(--red);color:#fff;border-color:var(--red)}
.side.hot svg.i{stroke:#fff}
.side b{display:block;font-size:18px;font-weight:500}
.tot{text-align:center;padding:24px}
.tot b{font-family:"Frank Ruhl Libre",serif;font-size:44px;font-weight:300;display:block}
.scene{display:none;position:fixed;inset:0;z-index:40;align-items:center;justify-content:center;perspective:1400px;background:radial-gradient(circle,#efebe5,#c9c1b5)}
.obj{position:relative;width:240px;height:440px;transform-style:preserve-3d}
.obj.pw{width:250px;height:340px}
.in{position:absolute;inset:0;border-radius:14px;background:linear-gradient(#fff,#e9e7e3);box-shadow:inset 0 0 40px rgba(0,0,0,.15);transform:translateZ(-60px)}
.in i{display:block;height:2px;margin:0 10px;margin-top:22%;background:rgba(140,165,180,.55)}
.in b{position:absolute;top:61%;left:0;right:0;height:5px;background:#bdb8b0}
.in.p{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:30px;align-content:start;background:#2b2b2d}
.in.p span{height:54px;border-radius:6px;background:linear-gradient(#5d5d60,#323234)}
.sd{position:absolute;top:0;width:60px;height:100%;background:linear-gradient(90deg,#cfcac2,#e4e0da)}
.sd.l{left:0;transform-origin:left;transform:rotateY(90deg)}
.sd.r{right:0;transform-origin:right;transform:rotateY(-90deg)}
.dr{position:absolute;left:0;right:0;transform-origin:right center;border-radius:14px;border:1px solid #c9c5be;display:flex;align-items:center;justify-content:center;
background:linear-gradient(100deg,#fdfcfa,#e6e3de 70%,#d3cfc8);box-shadow:0 24px 50px rgba(0,0,0,.2)}
.dr::after{content:"";position:absolute;left:16px;top:30%;width:5px;height:40%;border-radius:4px;background:linear-gradient(#cfc9bf,#968f83)}
.dr em{font-style:normal;font-family:"Frank Ruhl Libre",serif;color:#8a857c;font-size:18px;letter-spacing:3px}
.dtop{top:0;height:60.5%}.dbot{bottom:0;height:38.5%}.dfull{top:0;bottom:0}
.fz{background:linear-gradient(#fff,#f1efeb);border-radius:26px;padding:14px;margin-bottom:22px;box-shadow:inset 0 0 0 1px #e2ded7,0 20px 40px rgba(0,0,0,.08)}
.zt{font-family:"Frank Ruhl Libre",serif;font-size:20px;margin:4px 6px 6px}
.frz{background:linear-gradient(#eef3f6,#dfe8ee);border-radius:18px;margin-top:14px;padding:6px}
.shelf{min-height:92px;border-bottom:3px solid rgba(160,185,198,.45);padding:8px 4px 6px;border-radius:8px;transition:background .2s}
.shelf.hl{background:rgba(255,255,255,.75)}
.sl{font-size:11px;color:var(--soft);letter-spacing:2px}
.items{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.it{position:relative;touch-action:none;-webkit-user-select:none;user-select:none;display:flex;flex-direction:column;align-items:center;width:64px;padding:6px 2px;border-radius:14px;background:rgba(255,255,255,.9);box-shadow:0 4px 10px rgba(0,0,0,.08);transition:opacity .3s;cursor:grab}
.it span{font-size:30px}.it small{font-size:11px;margin:0;color:var(--ink)}
.it.out{opacity:.28}
.it.ex::after{content:"";position:absolute;top:5px;left:5px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.cc{border-radius:20px;padding:22px;margin-bottom:14px;color:#fff;background:linear-gradient(135deg,#2b2b2e,#5a5a5f);box-shadow:0 14px 30px rgba(0,0,0,.18);animation:fan .7s cubic-bezier(.22,1,.36,1) both}
.cc .n{letter-spacing:4px;opacity:.85;margin:14px 0 6px}
.cc small{color:#ddd}
.cc input{margin-top:6px}
@keyframes fan{from{opacity:0;transform:translateY(60px) rotate(-4deg)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<header><h1>משק בית</h1><div class="rule"></div><div class="sub">כל הבית במקום אחד</div></header>
<div class="grid" id="grid"></div>
<div class="side" id="side" onclick="openToday()"></div>
<div class="scene" id="scene"></div>

<div class="screen" id="tasks">
  <div class="top"><h2>משימות</h2><button type="button" class="btn" onclick="closeAll()">חזרה</button></div>
  <div class="form card">
    <div class="f"><span>מה לעשות</span><input id="tTitle"></div>
    <div class="f"><span>תאריך</span><input id="tDate" type="date"></div>
    <div class="f"><span>שעה</span><input id="tTime" type="time"></div>
    <div class="f"><span>אחראי</span><select id="tWho"></select></div>
    <div class="f"><span>התראה</span><select id="tAlert"><option value="0">בזמן המשימה</option><option value="10">10 דקות לפני</option><option value="30">חצי שעה לפני</option><option value="60">שעה לפני</option><option value="1440">יום לפני</option></select></div>
    <button type="button" class="add" onclick="addTask()">הוסף משימה</button>
  </div>
  <div id="tOpen"></div><h3>בוצע</h3><div id="tDone"></div>
</div>

<div class="screen" id="today">
  <div class="top"><h2>היום</h2><button type="button" class="btn" onclick="closeAll()">חזרה</button></div>
  <div id="tToday"></div>
</div>

<div class="screen" id="fridge">
  <div class="top"><h2>מקרר</h2><button type="button" class="btn" onclick="closeAll()">חזרה</button></div>
  <div class="fz">
    <div class="zt">מקרר</div><div id="fTop"></div>
    <div class="frz"><div class="zt">מקפיא</div><div id="fBot"></div></div>
  </div>
  <div class="form card">
    <div class="f"><span>מוצר חדש</span><input id="fName"></div>
    <div class="f"><span>מדף</span><select id="fShelf"></select></div>
    <div class="f"><span>תאריך תפוגה</span><input id="fExp" type="date"></div>
    <button type="button" class="add" onclick="addItem()">הוסף למקרר</button>
  </div>
  <h3>רשימת קניות · אברגרין</h3><div id="fShop"></div>
</div>

<div class="screen" id="power">
  <div class="top"><h2>ארון חשמל</h2><button type="button" class="btn" onclick="closeAll()">חזרה</button></div>
  <div class="card tot"><small>החודש</small><b id="pTot"></b><small id="pCmp"></small></div>
  <div id="pList"></div>
</div>

<div class="screen" id="wallet">
  <div class="top"><h2>ארנק</h2><button type="button" class="btn" onclick="closeAll()">חזרה</button></div>
  <div id="wLock" class="form card">
    <div class="title" id="wMsg"></div>
    <input id="wPin" type="password" inputmode="numeric" maxlength="6">
    <button type="button" class="add" onclick="unlock()">המשך</button>
  </div>
  <div id="wIn">
    <div class="card tot"><small>הוצאות החודש</small><b id="wTot"></b></div>
    <div id="wCards"></div>
    <div class="form card">
      <div class="f"><span>שם הכרטיס</span><input id="cName"></div>
      <div class="f"><span>של מי</span><select id="cOwner"></select></div>
      <div class="f"><span>בנק</span><input id="cBank"></div>
      <div class="f"><span>4 ספרות אחרונות בלבד</span><input id="cLast" inputmode="numeric" maxlength="4"></div>
      <div class="f"><span>תוקף</span><input id="cExp" type="month"></div>
      <div class="f"><span>יום חיוב בחודש</span><input id="cDay" inputmode="numeric" maxlength="2"></div>
      <div class="f"><span>מסגרת $</span><input id="cLimit" inputmode="decimal"></div>
      <button type="button" class="add" onclick="addCard()">הוסף כרטיס</button>
    </div>
  </div>
</div>

<div class="screen" id="bday">
  <div class="top"><h2>ימי הולדת</h2><button type="button" class="btn" onclick="closeAll()">חזרה</button></div>
  <div id="bList"></div>
  <div class="form card">
    <div class="f"><span>שם</span><input id="bName"></div>
    <div class="f"><span>תאריך לידה</span><input id="bDate" type="date"></div>
    <button type="button" class="add" onclick="addBday()">הוסף יום הולדת</button>
  </div>
</div>

<div class="screen" id="soon">
  <div class="top"><h2 id="soonT"></h2><button type="button" class="btn" onclick="closeAll()">חזרה</button></div>
  <p class="empty">בקרוב</p>
</div>

<script>
const P={
check:'<circle cx="12" cy="12" r="9.5"/><path d="M7.5 12.3l3 3 6-6.6"/>',
fridge:'<rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M6 13.5h12M8.5 6v3M8.5 16v2.5"/>',
power:'<rect x="5" y="2.5" width="14" height="19" rx="1.5"/><path d="M12.8 6.5l-2.6 5h3.6l-2.6 5"/>',
wallet:'<path d="M4 7.5h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a1 1 0 0 1-1-1z"/><path d="M4 7.5l11-3.5v3.5M16 14h4"/>',
cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
mail:'<rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3 7.5l9 6 9-6"/>',
car:'<path d="M5 16v-5l2-5h10l2 5v5M3 16h18M7 19v-3M17 19v-3"/>',
child:'<circle cx="12" cy="7.5" r="3.5"/><path d="M5.5 20.5c0-3.8 2.9-6.5 6.5-6.5s6.5 2.7 6.5 6.5"/>',
med:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M12 9v7M8.5 12.5h7M9 5V3.5h6V5"/>',
home:'<path d="M3.5 11L12 3.5l8.5 7.5M5.5 9.5v11h13v-11M10 20.5v-5.5h4v5.5"/>',
subs:'<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8.5 20.5h7M12 17v3.5"/>',
pros:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3.5 17.5l3 3 5.8-5.8a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>',
docs:'<path d="M14 3H6.5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V8.5z"/><path d="M14 3v5.5h5.5M8.5 13h7M8.5 17h4.5"/>',
meals:'<path d="M4 11.5h16a8 8 0 0 1-16 0zM9 8c0-1 1-1 1-2.5M14 8c0-1 1-1 1-2.5"/>',
trip:'<path d="M21 15.5l-8-4.5V5a1.5 1.5 0 0 0-3 0v6l-7 4.5v2l7-2v4l-2 1.5v1.5l3.5-1 3.5 1v-1.5L13 19.5v-4l8 2z"/>',
fashion:'<path d="M12 7.5a2 2 0 1 1 2-2M12 7.5v1.5L3 16a1.5 1.5 0 0 0 1 2.5h16A1.5 1.5 0 0 0 21 16l-9-7"/>',
invest:'<path d="M3.5 20.5h17M5 16.5l4.5-5 3.5 3 6.5-7.5M15.5 7h4v4"/>',
cake:'<path d="M4 20.5h16v-7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2zM4 16c2 1.5 4 1.5 6 0s4-1.5 6 0 3 1.5 4 .5M12 11.5V8M12 5.2v.1"/>'};
const svg=k=>`<svg class="i" viewBox="0 0 24 24">${P[k]}</svg>`;
const parts=[["check","משימות","tasks"],["fridge","מקרר","fridge"],["power","ארון חשמל","power"],["wallet","ארנק","wallet"],["cake","ימי הולדת","bday"],
["cal","לוח שנה"],["mail","תיבת חשבונות"],["car","מכוניות"],["child","הילד"],["med","ארון תרופות"],["home","הבית"],
["subs","מנויים"],["pros","אנשי מקצוע"],["docs","מסמכים חשובים"],["meals","תכנון ארוחות"],
["trip","חופשות ובילויים"],["fashion","אופנה"],["invest","השקעות פיננסיות"]];

const SHELVES=["מוצרי חלב","ירקות ופירות","שתייה","בשר ודגים","לחם ומאפים"];
const FREEZER=[3,4];
const EMO={"חלב":"🥛","ביצ":"🥚","גבינ":"🧀","ירק":"🥦","פיר":"🍎","לחם":"🍞","בשר":"🥩","עוף":"🍗","דג":"🐟","מים":"💧","מיץ":"🧃","יוגורט":"🥣","חמאה":"🧈","גלידה":"🍨"};
const emo=n=>{for(const k in EMO)if(n.includes(k))return EMO[k];return "📦"};
const old=JSON.parse(localStorage.getItem("mb")||"null");
let S=JSON.parse(localStorage.getItem("mb2")||"null")||{
 tasks:old?.tasks||[],
 cards:(old?.cards||[]).map(c=>({n:c.n,l:c.l,spent:c.spent||0})),
 items:[["חלב",0],["גבינה",0],["ביצים",0],["ירקות",1],["לחם",4]].map(([n,s])=>({n,s,in:true,exp:""})),
 power:["מזגן","חימום","בוילר","מכונת כביסה ומייבש","טעינת טסלה"].map(n=>({n,now:0,last:0})),
 bdays:[{n:"איציק",d:""},{n:"אסתר",d:""},{n:"הילד",d:""}],pin:""};
const save=()=>{localStorage.setItem("mb2",JSON.stringify(S));draw()};
const buzz=()=>navigator.vibrate&&navigator.vibrate(8);
const PEOPLE=["איציק","אסתר","סינתיה"];
let
