<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f5">
<title>משק בית</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, "SF Pro Display", Arial, sans-serif; background: linear-gradient(180deg,#fafafc 0%,#e9e9ee 100%); color: #1c1c1e; min-height: 100vh; perspective: 1400px; -webkit-user-select: none; user-select: none; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  h1 { text-align: center; padding: 34px 0 6px; font-size: 34px; font-weight: 700; letter-spacing: -.5px; }
  .sub { text-align: center; color: #8e8e93; font-size: 15px; margin-bottom: 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(120px,1fr)); gap: 18px; padding: 20px; max-width: 1100px; margin: auto; }
  .icon { background: rgba(255,255,255,.65); border: 1px solid rgba(255,255,255,.9); border-radius: 28px; padding: 22px 8px; text-align: center; cursor: pointer; backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); box-shadow: 0 8px 24px rgba(60,60,67,.10), inset 0 1px 0 #fff; transition: transform .35s cubic-bezier(.34,1.56,.64,1), box-shadow .35s; }
  .icon:active { transform: scale(.92); box-shadow: 0 3px 10px rgba(60,60,67,.12); }
  .icon .e { font-size: 50px; display: block; margin-bottom: 10px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.12)); }
  .icon .t { font-size: 16px; font-weight: 600; color: #3a3a3c; }
  .zoom { position: fixed; z-index: 50; font-size: 50px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,.8); border-radius: 28px; transition: all 1.1s cubic-bezier(.22,1,.36,1); }
  .zoom.big { transform: translateZ(450px) rotateY(360deg) scale(4); opacity: 0; }
  .screen { display: none; position: fixed; inset: 0; background: #f2f2f7; padding: calc(env(safe-area-inset-top) + 16px) 18px 30px; overflow: auto; -webkit-overflow-scrolling: touch; animation: open .55s cubic-bezier(.22,1,.36,1); }
  @keyframes open { from { opacity: 0; transform: scale(.94) translateY(20px); } to { opacity: 1; transform: none; } }
  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .top h2 { font-size: 28px; font-weight: 700; }
  .back { background: rgba(255,255,255,.8); border: 1px solid #e5e5ea; color: #007aff; border-radius: 20px; padding: 8px 16px; font-size: 17px; cursor: pointer; transition: transform .2s; }
  .back:active, button.add:active { transform: scale(.95); }
  .card { background: rgba(255,255,255,.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 22px; box-shadow: 0 6px 20px rgba(60,60,67,.08); }
  .form { display: grid; gap: 10px; padding: 16px; margin-bottom: 22px; }
  input, select { font-size: 17px; padding: 13px; border-radius: 14px; border: 1px solid #e5e5ea; background: #f9f9fb; color: #1c1c1e; font-family: inherit; -webkit-user-select: text; user-select: text; }
  button.add { font-size: 17px; font-weight: 600; padding: 14px; border-radius: 14px; border: none; background: #8e8e93; color: #fff; cursor: pointer; transition: transform .2s; }
  .task { display: flex; align-items: center; gap: 14px; padding: 16px; margin-bottom: 10px; transition: opacity .4s, transform .4s; }
  .check { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #c7c7cc; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all .3s cubic-bezier(.34,1.56,.64,1); }
  .done .check { background: #34c759; border-color: #34c759; color: #fff; }
  .task small { color: #8e8e93; display: block; margin-top: 3px; font-size: 14px; }
  .done .title { text-decoration: line-through; color: #aeaeb2; }
  h3 { margin: 24px 4px 10px; color: #8e8e93; font-size: 14px; font-weight: 600; }
  p.empty { color: #aeaeb2; text-align: center; padding: 16px; }
</style>
</head>
<body>
<h1>משק בית</h1>
<div class="sub">כל הבית במקום אחד</div>
<div class="grid" id="grid"></div>

<div class="screen" id="tasks">
  <div class="top"><button class="back" onclick="closeScreen()">→ חזרה</button><h2>משימות</h2></div>
  <div class="form card">
    <input id="tTitle" placeholder="מה צריך לעשות?">
    <input id="tDate" type="date">
    <select id="tWho"><option>אני</option><option>אשתי</option><option>שנינו</option></select>
    <input id="tRemind" type="time">
    <button class="add" onclick="addTask()">הוסף משימה</button>
  </div>
  <div id="open"></div>
  <h3>בוצע</h3>
  <div id="closed"></div>
</div>

<div class="screen" id="soon">
  <div class="top"><button class="back" onclick="closeScreen()">→ חזרה</button><h2 id="soonTitle"></h2></div>
  <p class="empty">החלק הזה בבנייה 🔨</p>
</div>

<script>
const parts = [
  ["✅","משימות","tasks"],["🧊","מקרר"],["⚡","ארון חשמל"],["👛","ארנק"],["📅","לוח שנה"],
  ["📬","תיבת חשבונות"],["🚗","מכוניות"],["👦","הילד"],["💊","ארון תרופות"],["🏡","הבית"],
  ["📺","מנויים"],["🔧","אנשי מקצוע"],["📄","מסמכים חשובים"],["🍲","תכנון ארוחות"]
];
const buzz = () => { if (navigator.vibrate) navigator.vibrate(10); };
const grid = document.getElementById("grid");
parts.forEach(([e,t,id]) => {
  const d = document.createElement("div");
  d.className = "icon";
  d.innerHTML = `<span class="e">${e}</span><span class="t">${t}</span>`;
  d.onclick = () => { buzz(); openPart(d, e, t, id); };
  grid.appendChild(d);
});

function openPart(el, e, t, id) {
  const r = el.getBoundingClientRect();
  const z = document.createElement("div");
  z.className = "zoom";
  z.textContent = e;
  Object.assign(z.style, { left: r.left+"px", top: r.top+"px", width: r.width+"px", height: r.height+"px" });
  document.body.appendChild(z);
  requestAnimationFrame(() => requestAnimationFrame(() => z.classList.add("big")));
  setTimeout(() => {
    z.remove();
    if (id) { document.getElementById(id).style.display = "block"; render(); }
    else { soonTitle.textContent = e+" "+t; soon.style.display = "block"; }
  }, 1000);
}
function closeScreen() { buzz(); document.querySelectorAll(".screen").forEach(s => s.style.display = "none"); }

let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");
function save() { localStorage.setItem("tasks", JSON.stringify(tasks)); render(); }
function addTask() {
  const title = tTitle.value.trim();
  if (!title) return;
  buzz();
  tasks.push({ title, date: tDate.value, who: tWho.value, remind: tRemind.value, done: false });
  tTitle.value = "";
  save();
}
function toggle(i) { buzz(); tasks[i].done = !tasks[i].done; save(); }
function render() {
  const row = (t,i) => `<div class="task card ${t.done?'done':''}" onclick="toggle(${i})"><div class="check">${t.done?'✓':''}</div><div><div class="title">${t.title}</div><small>${t.date||''} · ${t.who} ${t.remind?'· ⏰ '+t.remind:''}</small></div></div>`;
  const all = tasks.map((t,i)=>[t,i]);
  open.innerHTML = all.filter(([t])=>!t.done).map(([t,i])=>row(t,i)).join("") || '<p class="empty">אין משימות פתוחות</p>';
  closed.innerHTML = all.filter(([t])=>t.done).map(([t,i])=>row(t,i)).join("");
}
</script>
</body>
</html>
