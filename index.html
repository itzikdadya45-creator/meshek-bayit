<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f4f3f1">
<title>משק בית</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;500&family=Heebo:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#1d1d1f;--soft:#6e6e73;--line:rgba(29,29,31,.1);--glass:rgba(255,255,255,.55);--red:#c8102e}
body{font-family:"Heebo",-apple-system,sans-serif;font-weight:300;color:var(--ink);min-height:100vh;-webkit-user-select:none;user-select:none;
background:radial-gradient(circle at 20% 10%,#fff 0%,transparent 50%),radial-gradient(circle at 85% 90%,#e4e2de 0%,transparent 55%),#f4f3f1;background-attachment:fixed}
header{text-align:center;padding:calc(env(safe-area-inset-top) + 44px) 0 6px}
h1{font-family:"Frank Ruhl Libre",serif;font-weight:300;font-size:46px;letter-spacing:1px}
.rule{width:40px;height:1px;background:var(--ink);margin:14px auto;opacity:.4}
.sub{color:var(--soft);font-size:13px;letter-spacing:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:16px;padding:28px 22px 60px;max-width:1100px;margin:auto}
.glass,.icon,.card{background:var(--glass);border:1px solid rgba(255,255,255,.85);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);box-shadow:0 10px 30px rgba(0,0,0,.05),inset 0 1px 0 rgba(255,255,255,.9)}
.icon{border-radius:26px;padding:26px 8px 20px;text-align:center;cursor:pointer;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.icon:active{transform:scale(.93)}
svg.i{width:38px;height:38px;stroke:var(--ink);stroke-width:1.1;fill:none;stroke-linecap:round;stroke-linejoin:round}
.icon .t{display:block;margin-top:12px;font-size:15px;font-weight:400}
.screen{display:none;position:fixed;inset:0;z-index:20;background:#f4f3f1;padding:calc(env(safe-area-inset-top) + 20px) 22px 50px;overflow:auto;-webkit-overflow-scrolling:touch}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.top h2{font-family:"Frank Ruhl Libre",serif;font-weight:300;font-size:34px}
.btn{background:var(--glass);border:1px solid var(--line);color:var(--ink);border-radius:22px;padding:9px 16px;font:400 15px "Heebo";cursor:pointer}
.btn:active,.add:active{transform:scale(.95)}
.card{border-radius:22px;margin-bottom:12px}
.form{display:grid;gap:12px;padding:18px;margin-bottom:24px}
label{font-size:13px;color:var(--soft);letter-spacing:1px;display:grid;gap:6px}
input,select{font:300 17px "Heebo";padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.75);color:var(--ink);width:100%;-webkit-user-select:text;user-select:text}
.add{font:400 16px "Heebo";letter-spacing:1px;padding:14px;border-radius:14px;border:none;background:var(--ink);color:#fff;cursor:pointer}
.row{display:flex;align-items:center;gap:14px;padding:15px 18px}
.chk{width:28px;height:28px;flex-shrink:0;cursor:pointer}
.chk circle{stroke:var(--soft);stroke-width:1;fill:none}
.chk path{stroke:#fff;stroke-width:1.6;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .4s}
.on .chk circle{fill:var(--ink);stroke:var(--ink)}
.on .chk path{stroke-dashoffset:0}
.grow{flex:1}
.title{font-size:17px;font-weight:400}
small{color:var(--soft);display:block;margin-top:3px;font-size:13px}
.done .title{text-decoration:line-through;color:#a1a1a6}
h3{margin:26px 4px 12px;color:var(--soft);font-size:12px;font-weight:400;letter-spacing:3px}
.empty{color:#a1a1a6;text-align:center;padding:16px}
.warn{color:var(--red)}
.side{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:30;width:54px;padding:14px 0;border-radius:0 20px 20px 0;text-align:center;cursor:pointer;font-size:12px}
.side.hot{background:var(--red);color:#fff;border-color:var(--red)}
.side.hot svg.i{stroke:#fff}
.side b{display:block;font-size:18px;font-weight:500}
.door{position:fixed;left:0;right:0;z-index:25;background:linear-gradient(90deg,#fbfaf8,#e9e7e3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:"Frank Ruhl Libre",serif;font-size:26px;transform-origin:right center}
.door::after{content:"";position:absolute;left:24px;top:40%;width:4px;height:20%;border-radius:4px;background:#b8b5ae}
.tot{text-align:center;padding:24px}
.tot b{font-family:"Frank Ruhl Libre",serif;font-size:44px;font-weight:300;display:block}
.up{color:var(--red)}.down{color:#2e7d4f}
.cc{border-radius:20px;padding:22px;margin-bottom:14px;color:#fff;background:linear-gradient(135deg,#2b2b2e,#5a5a5f);box-shadow:0 14px 30px rgba(0,0,0,.18);animation:fan .7s cubic-bezier(.22,1,.36,1) both}
.cc .n{letter-spacing:4px;opacity:.8;margin:18px 0 8px}
.cc b{font-family:"Frank Ruhl Libre",serif;font-size:30px;font-weight:300}
@keyframes fan{from{opacity:0;transform:translateY(60px) rotate(-4deg)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<header><h1>משק בית</h1><div class="rule"></div><div class="sub">כל הבית במקום אחד</div></header>
<div class="grid" id="grid"></div>
<div class="side glass" id="side" onclick="openToday()"></div>

<div class="screen" id="tasks">
  <div class="top"><h2>משימות</h2><button class="btn" onclick="closeAll()">חזרה</button></div>
  <div class="form card">
    <label>מה לעשות<input id="tTitle"></label>
    <label>תאריך<input id="tDate" type="date"></label>
    <label>שעה<input id="tTime" type="time"></label>
    <label>אחראי<select id="tWho"></select></label>
    <label>התראה<select id="tAlert"><option value="0">בזמן המשימה</option><option value="10">10 דקות לפני</option><option value="30">חצי שעה לפני</option><option value="60">שעה לפני</option><option value="1440">יום לפני</option></select></label>
    <button class="add" onclick="addTask()">הוסף משימה</button>
  </div>
  <div id="tOpen"></div><h3>בוצע</h3><div id="tDone"></div>
</div>

<div class="screen" id="today">
  <div class="top"><h2>היום</h2><button class="btn" onclick="closeAll()">חזרה</button></div>
  <div id="tToday"></div>
</div>

<div class="screen" id="fridge">
  <div class="top"><h2>מקרר</h2><button class="btn" onclick="closeAll()">חזרה</button></div>
  <div id="fBody"></div>
  <div class="form card">
    <label>מוצר חדש<input id="fName"></label>
    <label>מדף<select id="fShelf"></select></label>
    <label>תאריך תפוגה<input id="fExp" type="date"></label>
    <button class="add" onclick="addItem()">הוסף למקרר</button>
  </div>
  <h3>רשימת קניות · אברגרין</h3><div id="fShop"></div>
</div>

<div class="screen" id="power">
  <div class="top"><h2>ארון חשמל</h2><button class="btn" onclick="closeAll()">חזרה</button></div>
  <div class="card tot"><small>החודש</small><b id="pTot"></b><small id="pCmp"></small></div>
  <div id="pList"></div>
</div>

<div class="screen" id="wallet">
  <div class="top"><h2>ארנק</h2><button class="btn" onclick="closeAll()">חזרה</button></div>
  <div class="card tot"><small>הוצאות החודש</small><b id="wTot"></b></div>
  <div id="wCards"></div>
  <div class="form card">
    <label>שם הכרטיס<input id="cName" placeholder="למשל: אמקס של איציק"></label>
    <label>4 ספרות אחרונות בלבד<input id="cLast" inputmode="numeric" maxlength="4"></label>
    <button class="add" onclick="addCard()">הוסף כרטיס</button>
  </div>
</div>

<div class="screen" id="soon">
  <div class="top"><h2 id="soonT"></h2><button class="btn" onclick="closeAll()">חזרה</button></div>
  <p class="empty">בקרוב</p>
</div>

<script>
const P={
check:'<circle cx="12" cy="12" r="9.5"/><path d="M7.5 12.3l3 3 6-6.6"/>',
fridge:'<rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M6 9.5h12M9 5.5v2M9 12.5v3"/>',
power:'<rect x="5" y="2.5" width="14" height="19" rx="1.5"/><path d="M12.8 6.5l-2.6 5h3.6l-2.6 5"/><circle cx="16.5" cy="12" r=".4"/>',
wallet:'<path d="M4 7.5h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a1 1 0 0 1-1-1z"/><path d="M4 7.5l11-3.5v3.5M16 14h4"/>',
cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
mail:'<rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3 7.5l9 6 9-6"/>',
car:'<path d="M5 16v-5l2-5h10l2 5v5M3 16h18M7 19v-3M17 19v-3"/>',
child:'<circle cx="12" cy="7.5" r="3.5"/><path d="M5.5 20.5c0-3.8 2.9-6.5 6.5-6.5s6.5 2.7 6.5 6.5"/>',
med:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M12 9v7M8.5 12.5h7M9 5V3.5h6V5"/>',
home:'<path d="M3.5 11L12 3.5l8.5 7.5M5.5 9.5v11h13v-11M10 20.5v-5.5h4v5.5"/>',
subs:'<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8.5 20.5h7M12 17v3.5"/>',
pros:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3.5 17.5l3 3 5.8-5.8a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>',
docs:'<path d="M14 3H6.5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V8.5z"/><path d="M14 3v5.5h5.5M8.5 13h7M8.5 17h4.5"/>',
meals:'<path d="M4 11.5h16a8 8 0 0 1-16 0zM9 8c0-1 1-1 1-2.5M14 8c0-1 1-1 1-2.5"/>',
trip:'<path d="M21 15.5l-8-4.5V5a1.5 1.5 0 0 0-3 0v6l-7 4.5v2l7-2v4l-2 1.5v1.5l3.5-1 3.5 1v-1.5L13 19.5v-4l8 2z"/>',
fashion:'<path d="M12 7.5a2 2 0 1 1 2-2M12 7.5v1.5L3 16a1.5 1.5 0 0 0 1 2.5h16A1.5 1.5 0 0 0 21 16l-9-7"/>',
invest:'<path d="M3.5 20.5h17M5 16.5l4.5-5 3.5 3 6.5-7.5M15.5 7h4v4"/>'};
const svg=k=>`<svg class="i" viewBox="0 0 24 24">${P[k]}</svg>`;
const parts=[["check","משימות","tasks"],["fridge","מקרר","fridge"],["power","ארון חשמל","power"],["wallet","ארנק","wallet"],
["cal","לוח שנה"],["mail","תיבת חשבונות"],["car","מכוניות"],["child","הילד"],["med","ארון תרופות"],["home","הבית"],
["subs","מנויים"],["pros","אנשי מקצוע"],["docs","מסמכים חשובים"],["meals","תכנון ארוחות"],
["trip","חופשות ובילויים"],["fashion","אופנה"],["invest","השקעות פיננסיות"]];

const SHELVES=["מוצרי חלב","ירקות ופירות","בשר ודגים","שתייה","מקפיא"];
let S=JSON.parse(localStorage.getItem("mb")||"null")||{tasks:[],cards:[],
 items:[["חלב",0],["גבינה",0],["ביצים",0],["ירקות",1],["לחם",4]].map(([n,s])=>({n,s,in:true,exp:""})),
 power:["מזגן","חימום","בוילר","מכונת כביסה ומייבש","טעינת טסלה"].map(n=>({n,now:0,last:0}))};
const save=()=>{localStorage.setItem("mb",JSON.stringify(S));draw()};
const buzz=()=>navigator.vibrate&&navigator.vibrate(8);
const PEOPLE=["איציק","אסתר","סינתיה"];
let me=localStorage.getItem("me");
if(!me){me=(prompt("מי משתמש במכשיר הזה? איציק, אסתר, סינתיה, או מטבח")||"מטבח").trim();localStorage.setItem("me",me)}
const nm=w=>w===me?"אני":w;
const todayStr=()=>new Date().toISOString().slice(0,10);
tWho.innerHTML=PEOPLE.map(p=>`<option value="${p}">${nm(p)}</option>`).join("")+'<option value="כולם">כולם</option>';
if(PEOPLE.includes(me))tWho.value=me;
fShelf.innerHTML=SHELVES.map((s,i)=>`<option value="${i}">${s}</option>`).join("");

parts.forEach(([k,t,id])=>{const d=document.createElement("div");d.className="icon";
 d.innerHTML=svg(k)+`<span class="t">${t}</span>`;d.onclick=()=>{buzz();openFrom(d,id||"soon",t)};grid.appendChild(d)});

function openFrom(el,id,t){
 const sc=document.getElementById(id);if(id==="soon")soonT.textContent=t;
 draw();sc.style.display="block";
 const r=el.getBoundingClientRect();sc.style.transformOrigin=`${r.left+r.width/2}px ${r.top+r.height/2}px`;
 sc.animate([{transform:"perspective(1200px) scale(.12) rotateY(-220deg)",opacity:.3,borderRadius:"40px"},
  {transform:"perspective(1200px) scale(1) rotateY(0)",opacity:1,borderRadius:"0px"}],{duration:1400,easing:"cubic-bezier(.22,1,.36,1)"});
 if(id==="fridge")doors([["מקרר","0","62%"],["מקפיא","62%","38%"]]);
 if(id==="power")doors([["ארון חשמל","0","100%"]]);}
function doors(list){list.forEach(([label,top,h])=>{const d=document.createElement("div");d.className="door";d.textContent=label;
 Object.assign(d.style,{top,height:h});document.body.appendChild(d);
 d.animate([{transform:"perspective(1400px) rotateY(0)"},{transform:"perspective(1400px) rotateY(-105deg)",opacity:0}],
  {duration:1100,delay:900,easing:"cubic-bezier(.65,0,.35,1)",fill:"forwards"}).onfinish=()=>d.remove()})}
function closeAll(){buzz();document.querySelectorAll(".screen").forEach(s=>s.style.display="none");draw()}

function addTask(){const title=tTitle.value.trim();if(!title)return;buzz();
 S.tasks.push({title,date:tDate.value,time:tTime.value,who:tWho.value,alert:+tAlert.value,done:false});tTitle.value="";save()}
function toggle(i){buzz();S.tasks[i].done=!S.tasks[i].done;save()}
const chk='<svg class="chk" viewBox="0 0 28 28"><circle cx="14" cy="14" r="12.5"/><path d="M8.5 14.3l3.6 3.6 7.4-7.6"/></svg>';
function taskRow(t,i){return `<div class="card row ${t.done?'done on':''}"><span onclick="toggle(${i})">${chk}</span>
 <div class="grow"><div class="title">${t.title}</div><small>${t.date||'ללא תאריך'}${t.time?' · '+t.time:''} · ${nm(t.who)}</small></div>
 ${t.done?'':`<button class="btn" onclick="addCal(${i})">⏰</button>`}</div>`}
function addCal(i){const t=S.tasks[i];if(!t.date){alert("צריך לבחור תאריך למשימה");return}
 const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//MeshekBayit//HE","BEGIN:VEVENT","UID:"+Date.now()+"@meshek-bayit",
 "DTSTART:"+t.date.replace(/-/g,"")+"T"+(t.time||"09:00").replace(":","")+"00","DURATION:PT30M","SUMMARY:"+t.title,
 "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+t.title,"TRIGGER:-PT"+(t.alert||0)+"M","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
 const a=document.createElement("a");a.href="data:text/calendar;charset=utf-8,"+encodeURIComponent(ics);a.download="task.ics";a.click()}
function openToday(){buzz();draw();today.style.display="block";
 today.animate([{transform:"translateX(-100%)"},{transform:"none"}],{duration:600,easing:"cubic-bezier(.22,1,.36,1)"})}

function addItem(){const n=fName.value.trim();if(!n)return;buzz();S.items.push({n,s:+fShelf.value,in:true,exp:fExp.value});fName.value="";fExp.value="";save()}
function toggleItem(i){buzz();S.items[i].in=!S.items[i].in;save()}
const soonExp=d=>d&&(new Date(d)-new Date(todayStr()))/864e5<=2;

function addCard(){const n=cName.value.trim(),l=cLast.value.replace(/\D/g,"").slice(-4);if(!n)return;buzz();
 S.cards.push({n,l,spent:0});cName.value="";cLast.value="";save()}
function setNum(path,i,key,v){S[path][i][key]=+v||0;save()}

function draw(){
 const all=S.tasks.map((t,i)=>[t,i]),open=all.filter(([t])=>!t.done);
 tOpen.innerHTML=open.map(([t,i])=>taskRow(t,i)).join("")||'<p class="empty">אין משימות פתוחות</p>';
 tDone.innerHTML=all.filter(([t])=>t.done).map(([t,i])=>taskRow(t,i)).join("");
 const td=open.filter(([t])=>!t.date||t.date<=todayStr());
 tToday.innerHTML=td.map(([t,i])=>taskRow(t,i)).join("")||'<p class="empty">אין משימות להיום</p>';
 side.className="side glass"+(open.length?" hot":"");side.innerHTML=svg("check")+`<b>${open.length}</b>משימות`;
 fBody.innerHTML=SHELVES.map((sh,si)=>`<h3>${si===4?"מקפיא":"מקרר · "+sh}</h3>`+
  (S.items.map((it,i)=>[it,i]).filter(([it])=>it.s===si).map(([it,i])=>`<div class="card row ${it.in?'on':''}">
  <span onclick="toggleItem(${i})">${chk}</span><div class="grow"><div class="title">${it.n}</div>
  <small class="${soonExp(it.exp)?'warn':''}">${it.in?'במקרר':'חסר'}${it.exp?' · תפוגה '+it.exp:''}</small></div></div>`).join("")||'<p class="empty">ריק</p>')).join("");
 const miss=S.items.filter(it=>!it.in);
 fShop.innerHTML=miss.map(it=>`<div class="card row"><div class="grow title">${it.n}</div>
  <a class="btn" href="https://www.shopevergreenkosher.com/" target="_blank">לקנייה</a></div>`).join("")||'<p class="empty">לא חסר כלום</p>';
 const now=S.power.reduce((a,p)=>a+p.now,0),last=S.power.reduce((a,p)=>a+p.last,0);
 pTot.textContent="$"+now.toFixed(2);pCmp.innerHTML=last?`חודש קודם $${last.toFixed(2)} <span class="${now>last?'up':'down'}">${now>last?'▲':'▼'}</span>`:"";
 pList.innerHTML=S.power.map((p,i)=>`<div class="card row"><div class="grow"><div class="title">${p.n}
  ${p.last?`<span class="${p.now>p.last?'up':'down'}">${p.now>p.last?'▲':'▼'}</span>`:''}</div></div>
  <label>החודש $<input style="width:90px" inputmode="decimal" value="${p.now||''}" onchange="setNum('power',${i},'now',this.value)"></label>
  <label>קודם $<input style="width:90px" inputmode="decimal" value="${p.last||''}" onchange="setNum('power',${i},'last',this.value)"></label></div>`).join("");
 wTot.textContent="$"+S.cards.reduce((a,c)=>a+c.spent,0).toFixed(2);
 wCards.innerHTML=S.cards.map((c,i)=>`<div class="cc" style="animation-delay:${i*.12}s"><div>${c.n}</div><div class="n">•••• ${c.l}</div>
  <label style="color:#ddd">הוצאות החודש $<input inputmode="decimal" value="${c.spent||''}" onchange="setNum('cards',${i},'spent',this.value)"></label></div>`).join("")||'<p class="empty">עוד אין כרטיסים</p>';
}
draw();
</script>
</body>
</html>
